<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Wand stick - sleek black/purple gradient -->
  <defs>
    <linearGradient id="wandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D1B4E"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  
  <!-- Wand body - thin elegant stick -->
  <line x1="8" y1="8" x2="30" y2="30" stroke="url(#wandGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Gold band near tip -->
  <circle cx="10" cy="10" r="2.5" fill="#FFD700" stroke="#DAA520" stroke-width="0.5"/>
  
  <!-- Glowing star tip -->
  <polygon points="4,0 5.5,3 9,3.5 6.5,6 7,9.5 4,7.5 1,9.5 1.5,6 -1,3.5 2.5,3" fill="#FFD700" stroke="#FFF" stroke-width="0.3"/>
  
  <!-- Sparkle effects -->
  <circle cx="0" cy="4" r="0.8" fill="#fff"/>
  <circle cx="7" cy="0" r="0.6" fill="#FFE4B5"/>
  <circle cx="9" cy="5" r="0.5" fill="#FFD700"/>
  <circle cx="1" cy="8" r="0.4" fill="#fff"/>
</svg>
